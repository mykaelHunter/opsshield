name: OpsShield CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required for github/codeql-action/upload-sarif
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Static analysis (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/nodejs
            p/owasp-top-ten
            p/jwt
            p/express
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Dependency scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: security-scan
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: opsshield_test
          POSTGRES_USER: opsshield
          POSTGRES_PASSWORD: opsshield
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://opsshield:opsshield@localhost:5432/opsshield_test

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://opsshield:opsshield@localhost:5432/opsshield_test
          JWT_SECRET: test-secret-do-not-use-in-production-at-all
          JWT_REFRESH_SECRET: test-refresh-secret-do-not-use-in-production

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # required to request the OIDC token for configure-aws-credentials
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/opsshield:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/opsshield:latest .
          docker push $ECR_REGISTRY/opsshield:$IMAGE_TAG
          docker push $ECR_REGISTRY/opsshield:latest
          echo "image_uri=$ECR_REGISTRY/opsshield:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Container vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/opsshield:${{ github.sha }}
          severity: CRITICAL
          exit-code: 1

    outputs:
      image_uri: ${{ steps.build-image.outputs.image_uri }}

  deploy:
    name: Deploy (Terraform)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # required to request the OIDC token for configure-aws-credentials
      contents: read
    defaults:
      run:
        working-directory: infra/envs/prod
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform init
        run: terraform init

      - name: Validate image_uri
        run: |
          if [ -z "${{ needs.build.outputs.image_uri }}" ]; then
            echo "::error::image_uri output from build job is empty — refusing to deploy"
            exit 1
          fi

      - name: Terraform apply
        run: |
          terraform apply -auto-approve -input=false \
            -var="image_uri=${{ needs.build.outputs.image_uri }}" \
            -var="domain_name=${{ secrets.DOMAIN_NAME }}" \
            -var="parent_zone_name=${{ secrets.PARENT_ZONE_NAME }}" \
            -var="smtp_user=${{ secrets.SMTP_USER }}" \
            -var="budget_alert_email=${{ secrets.BUDGET_ALERT_EMAIL }}"
        env:
          # Values injected via TF_VAR_* rather than committed to any
          # .tfvars file in the repo — see infra/README.md and
          # infra/envs/prod/variables.tf for why these specifically
          # are treated as secrets rather than plain -var flags above.
          TF_VAR_paystack_secret_key: ${{ secrets.PAYSTACK_SECRET_KEY }}
          TF_VAR_smtp_pass: ${{ secrets.SMTP_PASS }}

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster $(terraform output -raw ecs_cluster_name) \
            --services $(terraform output -raw ecs_service_name) \
            --region ${{ secrets.AWS_REGION }}
